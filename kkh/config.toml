# .streamlit/config.toml

[server]
# Streamlit이 실행될 포트를 지정합니다.
port = 8501
# 서버 실행 시 자동으로 브라우저 창을 열지 않도록 설정합니다.
headless = true

[theme]
# Streamlit 앱의 테마를 커스터마이징할 수 있습니다.
# 아래는 예시 색상 코드입니다.
primaryColor="#4A90E2"
backgroundColor="#FFFFFF"
secondaryBackgroundColor="#F0F2F6"
textColor="#262730"
font="sans serif"

[logger]
# 로그 레벨을 설정합니다: 'error', 'warning', 'info', 'debug'
level = "info"

[client]
# 개발 중 유용한 툴바 모드를 설정합니다.
toolbarMode = "developer"