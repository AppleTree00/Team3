<body class="bg-background text-on-background min-h-screen flex flex-col kinetic-backdrop pb-24">
<!-- TopAppBar Section -->

<div class="flex justify-between items-center max-w-max-width mx-auto">
<button aria-label="뒤로 가기" class="flex items-center justify-center p-2 text-primary active:scale-95 transition-transform">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary font-bold">a4u.com</h1>
<div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center overflow-hidden border border-border-subtle">
<img alt="사용자 프로필" class="w-full h-full object-cover" data-alt="A professional close-up studio portrait of a confident Korean professional, softly lit with high-key lighting to match a clean light-mode UI. The background is a minimalist, out-of-focus office space with neutral tones. The aesthetic is modern, clean, and high-end, using a palette of soft whites and subtle blue shadows to evoke trust and authority." src="https://lh3.googleusercontent.com/aida-public/AB6AXuD4FWvO0udsJvKDSf1QBEFzKF1gdJOAfXBwdfY6Bqvj4880XvtCgd4aeiIGbQ2lBPY0FmJXouWQzSqJMeC2K8d91AAgkIt6yzou52wLFkgwabfE_9Xt69DpfvIryq15HvwSr7zXCpl6hykvC3l2SHPK_jejQDC1mWn0RidOJsZ5DOqHniyB9Vu9cKyk28VMHpFjbEQfh9-Hgoo69urVy5hlH3QcB_Q6kcEkff7uDD5lMKaZh19xa9jpog2e73NvyDcl77BcAtFVfwCi">
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow px-4 pt-6 max-w-lg mx-auto w-full">
<!-- Progress Indicator -->
<div class="flex items-center space-x-2 mb-8 px-2">
<div class="h-1.5 step-indicator-active bg-primary rounded-full"></div>
<div class="h-1.5 w-6 bg-surface-container-high rounded-full"></div>
<div class="h-1.5 w-6 bg-surface-container-high rounded-full"></div>
<div class="h-1.5 w-6 bg-surface-container-high rounded-full"></div>
<span class="ml-auto font-label-sm text-label-sm text-on-surface-variant">Step 1/4</span>
</div>
<!-- Section Title -->
<div class="mb-10">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-2">인적 사항</h2>
<p class="font-body-md text-body-md text-on-surface-variant">지원하시는 포지션에 필요한 기본 정보를 입력해 주세요.</p>
</div>
<!-- Form Section -->
<div class="glass-card rounded-xl p-6 shadow-sm space-y-8">
<!-- Input: Name -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant" for="name">성함</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-border-subtle rounded-lg px-4 py-3.5 focus:ring-2 focus:ring-primary focus:border-primary transition-all font-body-md text-body-md outline-none" id="name" placeholder="홍길동" type="text" value="홍길동">
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-outline-variant">person</span>
</div>
</div>
<!-- Input: Email -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant" for="email">이메일 주소</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-border-subtle rounded-lg px-4 py-3.5 focus:ring-2 focus:ring-primary focus:border-primary transition-all font-body-md text-body-md outline-none" id="email" placeholder="example@a4u.com" type="email">
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-outline-variant">mail</span>
</div>
</div>
<!-- Input: Phone -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant" for="phone">연락처</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-border-subtle rounded-lg px-4 py-3.5 focus:ring-2 focus:ring-primary focus:border-primary transition-all font-body-md text-body-md outline-none" id="phone" placeholder="010-0000-0000" type="tel">
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-outline-variant">phone_iphone</span>
</div>
</div>
</div>
<!-- Action Button -->
<div class="mt-12 mb-20">
<button class="w-full bg-primary text-on-primary font-label-md text-label-md py-4 rounded-xl shadow-lg shadow-primary/20 active:scale-[0.98] transition-all flex items-center justify-center space-x-2">
<span class="">다음 단계</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
</main>
<!-- Floating Action Button: Preview -->
<button class="fixed bottom-24 right-6 bg-secondary text-on-secondary w-14 h-14 rounded-full shadow-xl flex items-center justify-center active:scale-90 transition-transform z-40" id="previewFab">
<span class="material-symbols-outlined">visibility</span>
<span class="sr-only">미리보기</span>
</button>

<nav class="fixed bottom-0 w-full z-50 rounded-t-xl bg-surface-container-lowest shadow-[0_-4px_12px_rgba(30,41,59,0.05)] flex justify-around items-center px-4 py-2 pb-safe md:hidden">

<span class="material-symbols-outlined">dashboard</span>
<span class="font-label-sm text-label-sm-mobile">홈</span>
</a>
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-4 py-1 active:scale-90 transition-all duration-200" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">description</span>
<span class="font-label-sm text-label-sm-mobile font-bold">이력서</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant active:scale-90 transition-all duration-200" href="#">
<span class="material-symbols-outlined">assignment_turned_in</span>
<span class="font-label-sm text-label-sm-mobile">지원현황</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant active:scale-90 transition-all duration-200" href="#">
<span class="material-symbols-outlined">timeline</span>
<span class="font-label-sm text-label-sm-mobile">타임라인</span>
</a>
</nav>
<!-- Micro-interaction Script -->
<script>
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.parentElement.classList.add('scale-[1.02]');
                input.parentElement.parentElement.classList.add('transition-transform');
            });
            input.addEventListener('blur', () => {
                input.parentElement.parentElement.classList.remove('scale-[1.02]');
            });
        });

        const fab = document.getElementById('previewFab');
        fab.addEventListener('click', () => {
            const icon = fab.querySelector('.material-symbols-outlined');
            icon.textContent = icon.textContent === 'visibility' ? 'edit' : 'visibility';
            // Logic for toggle visual could go here
        });
    </script>
